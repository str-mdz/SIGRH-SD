services:
  postgres_vacaciones:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${VAC_DB_NAME}
      POSTGRES_USER: ${VAC_DB_USER}
      POSTGRES_PASSWORD: ${VAC_DB_PASSWORD}

    ports:
      - "127.0.0.1:55434:5432"

    volumes:
      - vacaciones_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vacaciones_pgdata:
