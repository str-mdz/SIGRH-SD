services:
  postgres_reclutamiento:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${RECL_DB_NAME}
      POSTGRES_USER: ${RECL_DB_USER}
      POSTGRES_PASSWORD: ${RECL_DB_PASSWORD}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - reclutamiento_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reclutamiento_pgdata:
