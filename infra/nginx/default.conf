server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Interfaz web de SIGRH
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Endpoints de salud
    location = /salud/usuarios {
        proxy_pass http://usuarios:8002/api/estado/;
    }

    location = /salud/reclutamiento {
        proxy_pass http://reclutamiento:8001/api/estado/;
    }

    location = /salud/vacaciones {
        proxy_pass http://vacaciones:8003/api/estado/;
    }

    location = /salud/nomina {
        proxy_pass http://nomina:8004/api/estado/;
    }
}
