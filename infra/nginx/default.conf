upstream usuarios_balanceados {
    zone usuarios_balanceados 64k;

    # DNS interno de Docker
    resolver 127.0.0.11 valid=1s ipv6=off;

    # Round Robin entre dos instancias
    server usuarios:8002 resolve max_fails=1 fail_timeout=5s;
    server usuarios_replica:8002 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # API DE USUARIOS CON BALANCEO

    location /api/usuarios/ {
        proxy_pass http://usuarios_balanceados/api/;

        proxy_set_header Host usuarios;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Solo para demostrar qué instancia respondió
        add_header X-SIGRH-Backend $upstream_addr always;
    }

    # ENDPOINTS DE SALUD


    location = /salud/usuarios {
        proxy_pass http://usuarios_balanceados/api/estado/;

        proxy_set_header Host usuarios;

        # Si una réplica falla, intentar la otra.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Indica qué instancia atendió la petición.
        add_header X-SIGRH-Backend $upstream_addr always;
    }


    location = /salud/reclutamiento {
        proxy_pass http://reclutamiento:8001/api/estado/;
    }

    location = /salud/vacaciones {
        proxy_pass http://vacaciones:8003/api/estado/;
    }

    location = /salud/nomina {
        proxy_pass http://nomina:8004/api/estado/;
    }

    # ========================================
    # INTERFAZ WEB ORIGINAL
    # ========================================

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}